name: tests

on:
  push:
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r printer_client/requirements.txt
      - run: coverage run manage.py test
        env:
          SECRET_KEY: ci-test-key
      - run: coverage run --append -m unittest discover -s printer_client/tests
      - run: coverage report
