<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CafeCorner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">CafeCorner</a>
      <div class="d-flex gap-3 align-items-center">
        {% if user.is_authenticated %}
          <span class="text-muted">{{ user.username }} · {{ user.profile.get_role_display }}</span>
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Log out</button></form>
        {% else %}
          <a href="{% url 'login' %}">Log in</a><a href="{% url 'register' %}">Create account</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container" style="max-width: 760px">
    {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
